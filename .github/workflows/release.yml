name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  version:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npx lerna version --conventional-commits --yes

  publish:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx lerna publish from-git --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            if [[ "$tag" == "@renatorodrigues/cacheiro@"* ]]; then
              gh release create "$tag" --title "$tag" --generate-notes --target main --latest
            else
              gh release create "$tag" --title "$tag" --generate-notes --target main --latest=false
            fi
          done

  docker:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - flavor: fs
            store_package: cacheiro-store-fs
          - flavor: s3
            store_package: cacheiro-store-s3
          - flavor: gcs
            store_package: cacheiro-store-gcs
          - flavor: azure
            store_package: cacheiro-store-azure
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check for changes
        id: check
        run: |
          TAGS=$(git tag --points-at HEAD)
          BUILD=false
          for pkg in "@renatorodrigues/${{ matrix.store_package }}" "@renatorodrigues/cacheiro" "@renatorodrigues/cacheiro-types" "@renatorodrigues/cacheiro-instants"; do
            if echo "$TAGS" | grep -qF "$pkg@"; then
              BUILD=true
            fi
          done
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          STORE_VERSION=$(node -p "require('./packages/${{ matrix.store_package }}/package.json').version")
          echo "store_version=$STORE_VERSION" >> "$GITHUB_OUTPUT"
          INSTANTS_VERSION=$(node -p "require('./packages/cacheiro-instants/package.json').version")
          echo "instants_version=$INSTANTS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/cacheiro-instants/Dockerfile
          build-args: |
            STORE_TYPE=${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cacheiro-instants-${{ matrix.flavor }}:${{ steps.check.outputs.instants_version }}
            ghcr.io/${{ github.repository_owner }}/cacheiro-instants-${{ matrix.flavor }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.check.outputs.instants_version }}
            io.renatorodrigues.store-version=${{ steps.check.outputs.store_version }}
